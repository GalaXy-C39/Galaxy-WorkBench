<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>梵高工作台 · Starry Workbench</title>
<link rel="apple-touch-icon" href="bart.png">
<style>
:root{
  --sky-top:#7EC0EE;
  --sky-mid:#B8DFF5;
  --sky-bottom:#FFD90F;
  --homer:#F5A623;
  --donut:#FF6B9D;
  --ink:#1A2A4A;
  --ink-dim:#3A4E6E;
  --glass:rgba(255,255,255,.4);
  --glass-hover:rgba(255,255,255,.35);
  --glass-active:rgba(255,255,255,.75);
  --star:#3a6ea5;
  --moon:#5a8fc4;
  --panel-border:rgba(255,255,255,.55);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  overflow:hidden;
  background:#4A7FA8;
}

/* ============ 天空背景 + 动画 ============ */
.canvas-bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 90% 55% at 50% -10%, #FFE680 0%, transparent 55%),
    radial-gradient(ellipse 100% 60% at 50% 40%, #A8D8F0 0%, transparent 65%),
    radial-gradient(ellipse 120% 70% at 50% 110%, #FFD90F 0%, transparent 60%),
    linear-gradient(180deg, #7EC0EE 0%, #B8DFF5 40%, #FFE9A8 75%, #FFD90F 100%);
}
.canvas-bg::before{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(circle 60px at 12% 16%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.85) 60%, transparent 62%),
    radial-gradient(circle 45px at 9% 20%, rgba(255,255,255,.95) 0%, transparent 62%),
    radial-gradient(circle 50px at 16% 21%, rgba(255,255,255,.9) 0%, transparent 62%),
    radial-gradient(circle 40px at 13% 24%, rgba(255,255,255,.9) 0%, transparent 62%),
    radial-gradient(circle 70px at 55% 11%, rgba(255,255,255,.9) 0%, transparent 62%),
    radial-gradient(circle 55px at 51% 15%, rgba(255,255,255,.9) 0%, transparent 62%),
    radial-gradient(circle 60px at 60% 15%, rgba(255,255,255,.85) 0%, transparent 62%),
    radial-gradient(circle 55px at 85% 26%, rgba(255,255,255,.85) 0%, transparent 62%),
    radial-gradient(circle 45px at 82% 30%, rgba(255,255,255,.85) 0%, transparent 62%),
    radial-gradient(circle 50px at 89% 30%, rgba(255,255,255,.8) 0%, transparent 62%),
    radial-gradient(circle 45px at 38% 40%, rgba(255,255,255,.7) 0%, transparent 62%),
    radial-gradient(circle 38px at 35% 43%, rgba(255,255,255,.7) 0%, transparent 62%),
    radial-gradient(circle 42px at 42% 43%, rgba(255,255,255,.65) 0%, transparent 62%);
  filter:drop-shadow(0 6px 14px rgba(74,127,168,.18));
  animation:cloudDrift 90s linear infinite;
  pointer-events:none;
  z-index:1;
}
@keyframes cloudDrift{
  0%{transform:translateX(0)}
  50%{transform:translateX(60px)}
  100%{transform:translateX(0)}
}

/* 顶部辛普森装饰带 */
.simpson-band{
  position:fixed;top:0;left:0;right:0;height:6px;z-index:5;
  background:linear-gradient(90deg,
    #FFD90F 0%,   #FFD90F 14%,
    #FF6B9D 14%,  #FF6B9D 28%,
    #7EC0EE 28%,  #7EC0EE 42%,
    #FFD90F 42%,  #FFD90F 56%,
    #A8E6A1 56%,  #A8E6A1 70%,
    #FF9F43 70%,  #FF9F43 84%,
    #FFD90F 84%,  #FFD90F 100%);
  background-size:200% 100%;
  box-shadow:0 2px 12px rgba(255,217,15,.5);
  animation:bandFlow 6s linear infinite;
  pointer-events:none;
}
@keyframes bandFlow{
  0%{background-position:0% 0}
  100%{background-position:200% 0}
}

/* ============ 布局 ============ */
.app{
  position:relative;z-index:2;
  display:grid;
  grid-template-columns:300px 1fr;
  height:100vh;
}

/* ============ 侧边栏 ============ */
.sidebar{
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border-right:1px solid rgba(255,255,255,.6);
  display:flex;flex-direction:column;
  padding:30px 18px 24px;
  gap:8px;
  overflow-y:auto;
  box-shadow:4px 0 24px rgba(40,80,120,.08);
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}

.profile{
  padding:8px 6px 18px;
  border-bottom:1px solid rgba(255,255,255,.1);
  margin-bottom:10px;
}
.profile .row{display:flex;align-items:center;gap:12px}
.avatar{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,#5a8fc4,#3a6ea5);
  display:grid;place-items:center;
  font-weight:700;color:#fff;font-size:18px;
  box-shadow:0 0 16px rgba(90,143,196,.45);
}
.profile h2{font-size:15px;font-weight:600}
.profile .date{font-size:12px;color:var(--ink-dim);margin-top:3px}
.quote{
  margin-top:12px;font-size:12.5px;color:var(--ink-dim);
  font-style:italic;line-height:1.5;
  padding-left:10px;border-left:2px solid var(--star);
}

/* 目录项 */
.nav-item{
  position:relative;
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:10px;
  cursor:pointer;font-size:14px;
  color:var(--ink-dim);
  transition:.22s ease;
  user-select:none;
}
.nav-item:hover{background:var(--glass-hover);color:var(--ink)}
.nav-item.active{
  background:var(--glass-active);
  color:var(--ink);font-weight:600;
}
.nav-item.active::before{
  content:"";position:absolute;left:-6px;top:20%;height:60%;width:3px;
  border-radius:3px;
  background:linear-gradient(180deg,#FFD90F,#E8B800);
  box-shadow:0 0 10px rgba(255,217,15,.8);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:.85;transform:scaleY(1)}
  50%{opacity:1;transform:scaleY(1.08)}
}
.nav-item .ico{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none}
.nav-item .label{flex:1}
.nav-item .mini-bar{
  width:44px;height:5px;border-radius:99px;
  background:rgba(255,255,255,.35);overflow:hidden;
}
.nav-item .mini-bar i{
  display:block;height:100%;
  background:linear-gradient(90deg,#F5A623,#FFD90F);
  border-radius:99px;
}

.sidebar .spacer{flex:1}
.bottom{display:flex;gap:8px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)}
.bottom .nav-item{flex:1;justify-content:center;padding:9px 6px;font-size:13px}

/* ============ 主内容区 ============ */
.content{
  position:relative;
  padding:38px 40px 32px;
  overflow-y:auto;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.15));
}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:4px}
.content > *{
  animation:fadeUp .45s cubic-bezier(.4,0,.2,1) both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}

.page-title{
  font-size:26px;font-weight:700;letter-spacing:.5px;
  margin-bottom:6px;
  text-shadow:0 2px 8px rgba(40,80,120,.15);
}
.page-sub{
  color:var(--ink-dim);font-size:13px;margin-bottom:26px;
  text-shadow:0 1px 4px rgba(40,80,120,.1);
}

/* 卡片 */
.card{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid rgba(255,255,255,.7);
  border-radius:16px;
  padding:20px 22px;
  margin-bottom:18px;
  box-shadow:0 8px 28px rgba(40,80,120,.12);
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 36px rgba(40,80,120,.2), 0 0 0 1px rgba(255,217,15,.6);
}
.card h3{
  font-size:15px;font-weight:600;
  display:flex;align-items:center;gap:8px;
  margin-bottom:14px;
}
.card h3 .tag{
  margin-left:auto;font-size:11px;
  padding:3px 10px;border-radius:99px;
  background:rgba(245,166,35,.18);color:#8a5500;
  border:1px solid rgba(245,166,35,.35);
}

/* 进度条 */
.progress{
  height:8px;border-radius:99px;
  background:rgba(255,255,255,.4);
  overflow:hidden;margin:10px 0 4px;
}
.progress i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#F5A623,#FFD90F,#FFE680,#FFD90F,#F5A623);
  background-size:200% 100%;
  box-shadow:0 0 12px rgba(245,166,35,.6);
  transition:width .5s ease;
  animation:flow 3s linear infinite;
}
@keyframes flow{
  0%{background-position:0% 0}
  100%{background-position:200% 0}
}
.progress-text{
  display:flex;justify-content:space-between;
  font-size:12px;color:var(--ink-dim);margin-bottom:14px;
}

/* 任务列表 */
.task{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:9px;
  transition:.2s;cursor:pointer;
}
.task:hover{background:rgba(255,255,255,.4)}
.task .check{
  width:18px;height:18px;border-radius:50%;
  border:1.6px solid rgba(58,110,165,.6);
  display:grid;place-items:center;flex-shrink:0;
  transition:.2s;cursor:pointer;
}
.task.done .check{
  background:linear-gradient(135deg,#F5A623,#FFD90F);
  border-color:transparent;
}
.task.done .check::after{
  content:"✓";color:#12294d;font-size:12px;font-weight:800;
}
.task.done .txt{text-decoration:line-through;color:var(--ink-dim);opacity:.65}
.task .txt{flex:1;font-size:13.5px}
.task .ddl{
  font-size:11px;padding:2px 8px;border-radius:99px;
  background:rgba(58,110,165,.12);color:var(--ink-dim);
  cursor:pointer;transition:.2s;
}
.task .ddl:hover{background:rgba(58,110,165,.25)}
/* 删除按钮 */
.task .del{
  width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;
  font-size:14px;color:rgba(58,110,165,.6);
  cursor:pointer;opacity:0;transition:.2s;
  margin-left:4px;
}
.task:hover .del{opacity:1}
.task .del:hover{background:rgba(255,80,80,.2);color:#c92a2a}
.task.high .txt::before{
  content:"●";color:#F5A623;margin-right:6px;font-size:10px;
}

/* 添加任务 */
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row input{
  flex:1;padding:9px 14px;border-radius:99px;
  background:rgba(255,255,255,.6);
  border:1px solid rgba(58,110,165,.2);
  color:#2c3e50;font-size:13px;outline:none;
}
.add-row input::placeholder{color:rgba(58,110,165,.5)}
.add-row input:focus{border-color:rgba(245,166,35,.6)}
.add-row button{
  padding:9px 18px;border-radius:99px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#F5A623,#FFD90F);
  color:#12294d;font-weight:700;font-size:13px;
  transition:.2s;
}
.add-row button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(245,166,35,.5)}

/* 热点卡片 */
.hot-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}
.hot-card{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(10px);
  border:1px solid rgba(245,166,35,.3);
  border-radius:var(--radius);
  padding:18px;
  position:relative;overflow:hidden;
  transition:.25s;cursor:pointer;
}
.hot-card:hover{
  transform:translateY(-3px);
  border-color:rgba(245,166,35,.7);
  box-shadow:0 12px 28px rgba(245,166,35,.2);
}
.hot-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#F5A623,#FFD90F,#F5A623);
}
.hot-card .rank{font-size:11px;color:#8a5500;letter-spacing:1px;margin-bottom:8px}
.hot-card h4{font-size:15px;line-height:1.4;margin-bottom:10px}
.hot-card .heat{
  font-size:12px;color:var(--ink-dim);
  display:flex;justify-content:space-between;
}
.hot-card .heat b{color:#F5A623}

/* 日期选择器弹窗 */
.date-pop{
  position:fixed;z-index:99;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.9);
  border-radius:12px;
  padding:12px;
  box-shadow:0 10px 30px rgba(30,60,100,.3);
  display:none;
}
.date-pop input[type="date"]{
  border:none;outline:none;
  background:rgba(74,127,168,.1);
  padding:8px 12px;border-radius:8px;
  font-size:13px;color:#1A2A4A;
  font-family:inherit;
}
.date-pop .btns{display:flex;gap:6px;margin-top:10px}
.date-pop button{
  flex:1;padding:6px 10px;border-radius:8px;border:none;
  font-size:12px;cursor:pointer;font-family:inherit;
}
.date-pop .ok{background:#4A7FA8;color:#fff}
.date-pop .clear{background:rgba(74,127,168,.15);color:#4A7FA8}

/* 到期状态色 */
.ddl.overdue{background:rgba(255,80,80,.3);color:#c92a2a;font-weight:600}
.ddl.today{background:rgba(255,217,15,.5);color:#7a5c00;font-weight:600}
.ddl.soon{background:rgba(245,166,35,.4);color:#8a5500;font-weight:600}

.empty{
  text-align:center;padding:70px 20px;
  color:var(--ink-dim);font-size:14px;
}
.empty .big{font-size:44px;margin-bottom:14px;opacity:.6}

@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);z-index:10}
  .sidebar.open{transform:none}
}
</style>
</head>
<body>

<div class="canvas-bg"></div>
<div class="simpson-band"></div>

<div class="app">
  <aside class="sidebar">
    <div class="profile">
      <div class="row">
        <div class="avatar">G</div>
        <div>
          <h2>欢迎回来，Galaxy✨</h2>
          <div class="date" id="today"></div>
        </div>
      </div>
      <div class="quote">"他人之所得并非我之所失去"</div>
    </div>

    <div class="nav-item active" data-page="study">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span class="label">学业任务</span>
      <span class="mini-bar"><i style="width:70%"></i></span>
    </div>

    <div class="nav-item" data-page="work">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span class="label">工作任务</span>
      <span class="mini-bar"><i style="width:45%"></i></span>
    </div>

    <div class="nav-item" data-page="python">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 3c-3 0-5 1-5 4v3h5v1H6c-2 0-3 1.5-3 4s1 4 3 4h2v-3c0-2 1-3 3-3h4c2 0 3-1 3-3V7c0-3-2-4-5-4z"/><circle cx="10" cy="6" r=".8" fill="currentColor"/></svg>
      <span class="label">Python</span>
      <span class="mini-bar"><i style="width:80%"></i></span>
    </div>

    <div class="nav-item" data-page="daily">
      <svg class="ico" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
      <span class="label">日常琐事</span>
    </div>

    <div class="nav-item" data-page="hot">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 2s4 5 4 9a4 4 0 0 1-8 0c0-1 .5-2 .5-2S6 11 6 15a6 6 0 0 0 12 0c0-5-6-13-6-13z"/></svg>
      <span class="label">小红书热点</span>
    </div>

    <div class="spacer"></div>

    <div class="bottom">
      <div class="nav-item" data-page="settings">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.4 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3.5L5 11a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.3-1a7 7 0 0 0 1.7 1l.4 2.5h5l.4-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.5-2-1.5c.1-.3.1-.7.1-1z"/></svg>
        <span class="label">设置</span>
      </div>
      <div class="nav-item" data-page="more">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span class="label">更多</span>
      </div>
    </div>
  </aside>

  <main class="content" id="content"></main>
</div>

<script>
/* ========== 数据层 ========== */
const KEY = "vg-workbench-v1";
const defaultData = {
  study: [
    {id:1, text:"合规课程作业", done:false, ddl:"10-18", high:false},
    {id:2, text:"周报汇报 PPT", done:false, ddl:"10-20", high:true},
    {id:3, text:"多邻国 每日打卡", done:true,  ddl:"今天", high:false},
  ],
  work: [
    {id:4, text:"ppt", done:false, ddl:"10-17", high:true},
    {id:5, text:"归档", done:false, ddl:"10-19", high:false},
    {id:6, text:"黑名单刷新", done:true, ddl:"10-14", high:false},
  ],
  python: [
    {id:7, text:"Pandas 数据清洗练习", done:true,  ddl:"—", high:false},
    {id:8, text:"FastAPI 用户模块", done:false, ddl:"10-22", high:true},
    {id:9, text:"写爬虫抓小红书热点", done:false, ddl:"10-16", high:false},
  ],
  daily: [
    {id:10, text:"取快递", done:false, ddl:"今天", high:false},
    {id:11, text:"交水电费", done:false, ddl:"10-20", high:false},
    {id:12, text:"买咖啡豆", done:true, ddl:"—", high:false},
  ]
};
let store = JSON.parse(localStorage.getItem(KEY) || "null") || defaultData;
const save = () => localStorage.setItem(KEY, JSON.stringify(store));

/* ========== 页面渲染 ========== */
const content = document.getElementById("content");

const pages = {
  study:  {title:"📚 学业任务", sub:"按 DDL 排好序，一件一件来", type:"list", key:"study", progress:70},
  work:   {title:"💼 工作任务", sub:"高优先级标黄", type:"list", key:"work", progress:45},
  python: {title:"🐍 Python 学习 / 开发", sub:"用代码把星星连成线", type:"list", key:"python", progress:80},
  daily:  {title:"🏠 日常琐事", sub:"完成即消除，轻松一下", type:"list", key:"daily", progress:null},
  hot:    {title:"🔥 小红书每日热点", sub:"Python 爬虫自动整理 · 每日更新", type:"hot"},
  settings:{title:"⚙️ 设置", sub:"主题 · 数据 · 账号", type:"settings"},
  more:   {title:"☰ 更多", sub:"关于 · 反馈 · 暗黑模式", type:"more"}
};

function renderPage(pageKey){
  const p = pages[pageKey];
  content.innerHTML = "";

  const h1 = document.createElement("h1");
  h1.className = "page-title"; h1.textContent = p.title;
  const sub = document.createElement("div");
  sub.className = "page-sub"; sub.textContent = p.sub;
  content.append(h1, sub);

  if(p.type === "list"){
    if(p.progress !== null){
      const done = store[p.key].filter(t=>t.done).length;
      const total = store[p.key].length;
      const pct = total ? Math.round(done/total*100) : 0;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h3>本周进度 <span class="tag">${done}/${total} 已完成</span></h3>
        <div class="progress"><i style="width:${pct}%"></i></div>
        <div class="progress-text"><span>完成度</span><span>${pct}%</span></div>
      `;
      content.appendChild(card);
    }

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h3>待办清单</h3>`;
    const list = document.createElement("div");
    store[p.key].forEach(t=>{
      const el = document.createElement("div");
      el.className = "task" + (t.done?" done":"") + (t.high?" high":"");
      el.innerHTML = `
        <span class="check"></span>
        <span class="txt">${t.text}</span>
        <span class="ddl">${t.ddl}</span>
        <span class="del" title="删除">×</span>
      `;
      el.querySelector(".check").onclick = (e)=>{
        e.stopPropagation();
        t.done = !t.done; save(); renderPage(pageKey);
      };
      const ddlEl = el.querySelector(".ddl");
      ddlEl.onclick = (e)=>{
        e.stopPropagation();
        openDatePicker(ddlEl, t, ()=>renderPage(pageKey));

/* ========== 日期工具 ========== */
function parseDdl(ddl){
  const now = new Date();
  const y = now.getFullYear();
  if(ddl === "今天") return new Date(y, now.getMonth(), now.getDate());
  if(ddl === "明天") return new Date(y, now.getMonth(), now.getDate()+1);
  if(/^\d{2}-\d{2}$/.test(ddl)){
    const [m,d] = ddl.split("-").map(Number);
    let date = new Date(y, m-1, d);
    if(date < new Date(y, now.getMonth(), now.getDate())) date = new Date(y+1, m-1, d);
    return date;
  }
  return null;
}

function applyDdlStatus(el, ddl){
  el.classList.remove("overdue","today","soon","urgent");
  const d = parseDdl(ddl);
  if(!d) return;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((d - today) / 86400000);
  if(diff < 0)       el.classList.add("overdue");
  else if(diff === 0) el.classList.add("today");
  else if(diff <= 2)  el.classList.add("soon");
  el.title = diff < 0 ? `已过期 ${-diff} 天` :
             diff === 0 ? "今天到期" :
             diff <= 2  ? `${diff} 天内到期` : "";
}

/* ========== 日期选择器 ========== */
function openDatePicker(anchor, task, onSaved){
  let pop = document.getElementById("__datePop");
  if(!pop){
    pop = document.createElement("div");
    pop.id = "__datePop";
    pop.className = "date-pop";
    pop.innerHTML = `
      <input type="date">
      <div class="btns">
        <button class="clear">清除</button>
        <button class="ok">确定</button>
      </div>
    `;
    document.body.appendChild(pop);
  }

  const rect = anchor.getBoundingClientRect();
  pop.style.left = Math.max(10, rect.left - 100) + "px";
  pop.style.top  = (rect.bottom + 6) + "px";
  pop.style.display = "block";

  const input = pop.querySelector("input");
  const parsed = parseDdl(task.ddl);
  if(parsed){
    const y = parsed.getFullYear();
    const m = String(parsed.getMonth()+1).padStart(2,"0");
    const d = String(parsed.getDate()).padStart(2,"0");
    input.value = `${y}-${m}-${d}`;
  } else {
    const n = new Date();
    input.value = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
  }

  pop.querySelector(".ok").onclick = ()=>{
    if(input.value){
      const [y,m,d] = input.value.split("-");
      task.ddl = `${m}-${d}`;
    }
    pop.style.display = "none";
    save(); onSaved();
  };
  pop.querySelector(".clear").onclick = ()=>{
    task.ddl = "待定";
    pop.style.display = "none";
    save(); onSaved();
  };

  setTimeout(()=>{
    document.addEventListener("click", function handler(e){
      if(!pop.contains(e.target)){
        pop.style.display = "none";
        document.removeEventListener("click", handler);
      }
    });
  }, 10);
}
